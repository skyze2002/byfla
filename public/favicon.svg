<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Flavia López">
  <!-- Azul marino de marca (--color-primary) -->
  <rect width="32" height="32" rx="7.5" fill="#1E3A5F"/>
  <!-- La F va dibujada con rectángulos, no con texto: así se ve igual en
       todos los sistemas, sin depender de que exista ninguna tipografía. -->
  <g fill="#FFFFFF">
    <rect x="10" y="8" width="4.6" height="16"/>
    <rect x="10" y="8" width="11.8" height="4.4"/>
    <rect x="10" y="14.6" width="8.6" height="4.1"/>
  </g>
</svg>
